<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriVida - Contacto</title>

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- MATERIALIZE ICONS -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- BOOTSTRAP ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- CSS EXTERNO -->
    <link rel="stylesheet" href="/css/style.css">

    

</head>
<body>
    <div class="container">

        <!-- ===== ENCABEZADO ===== -->
        <header>
            <h1>
                <span id="logo-tienda">
                <i class="bi bi-heart-pulse"></i>
                NutriVida - Consulta
                </span>
                
            </h1>

            <!-- MENÚ -->
            <nav class="nav-menu">
                <a href="/index.html">
                    <i class="bi-house-door"></i> Inicio
                </a>
                <a href="/paginas_paginas/servicios.html">
                    <i class="bi-clipboard2-check"></i> Catalogo / Servicios
                </a>
                <a href="/paginas_paginas/sub_paginas/nutricionistas.html" >
                    <i class="bi-person-badge"></i> Nutricionistas
                </a>
                <a href="/paginas_paginas/contacto.html" >
                    <i class="bi bi-person-check"></i> Consulta
                </a>
                <a href="/paginas_paginas/historia.html" >
                    <i class="bi-book"></i> Nuestra Historia
                </a>
                <a href="/paginas_paginas/usuario_simulado.html" >
                    <i class="bi-person-circle"></i> Usuario
                </a>
            </nav>  
        </header>

        <!-- ===== FORMULARIO DE CONTACTO ===== -->
        <section>
            <h2><i class="material-icons">contact_mail</i> Formulario para agendar una consulta</h2>
            <p>Completa el formulario y nos pondremos en contacto contigo.</p>

            <div class="row">
                <div class="col-md-8">
                    <!-- FORMULARIO -->
                    <form id="formularioContacto">

                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-person"></i> Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ej: María González">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-envelope"></i> Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-phone"></i> Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" placeholder="+56 9 1234 5678">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-tag"></i> Asunto</label>
                            <select class="form-select" id="asunto">
                                <option value="">Selecciona un motivo</option>
                                <option value="consulta">Consulta general</option>
                                <option value="pedido">Sobre mi pedido</option>
                                <option value="producto">Información de producto</option>
                                <option value="reclamo">Reclamo</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-chat-dots"></i> Mensaje</label>
                            <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
                        </div>

                        <!-- DONDE SE MUESTRA EL RESULTADO DE VALIDACIÓN -->
                        <div id="resultado-validacion"></div>

                        <div class="d-flex gap-3 mt-3">
                            <!-- BOTÓN VALIDAR - Llama a funciones.js -->
                            <button type="button" class="btn-enviar" onclick="validadFormulario('formularioContacto')">
                                <i class="bi bi-send"></i> Enviar
                            </button>
                            
                            <!-- BOTÓN LIMPIAR - Llama a funciones.js -->
                            <button type="button" class="btn-limpiar" onclick="reseteadFormulario('formularioContacto')">
                                <i class="bi bi-eraser"></i> Limpiar
                            </button>
                        </div>
                    </form>
                </div>

                

            </div>
        </section>

        


        <!-- ===== PIE ===== -->
        <footer>
        <p><a href="/index.html">&copy</a> © 2026 - Clinica NutriVida - Todos los derechos reservados</p>
        
        </footer>

    </div>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <!-- FUNCIONES.JS -->
    
    <script src="funciones.js"></script>
    
</body>
</html>
